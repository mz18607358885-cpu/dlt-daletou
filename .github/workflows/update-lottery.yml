name: 定时更新大乐透数据

on:
  # 每周一/三/六 北京时间 21:35 跑(开奖后 5 分钟,数据稳定)
  schedule:
    - cron: '35 13 * * 1,3,6'   # UTC 13:35 = 北京 21:35
  # 允许手动触发
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取最新数据
        id: fetch
        run: |
          node scripts/fetch-lottery.js

      - name: 提交并推送
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/history.json
            git commit -m "chore: 更新大乐透数据 $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "✓ 数据已更新并推送"
          else
            echo "✓ 数据无变化,无需提交"
          fi
